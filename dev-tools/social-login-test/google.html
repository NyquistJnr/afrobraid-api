<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Google Sign-In test harness (dev only)</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    label { display: block; margin-top: 16px; font-weight: 600; font-size: 14px; }
    input, select { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 12px; padding: 8px 16px; cursor: pointer; }
    textarea { width: 100%; height: 90px; margin-top: 8px; font-family: monospace; font-size: 12px; }
    pre { background: #f4f4f5; padding: 12px; border-radius: 6px; overflow-x: auto; white-space: pre-wrap; }
    #signin-slot { margin-top: 12px; }
    .hint { color: #71717a; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Google Sign-In test harness</h1>
  <p class="hint">
    This is a throwaway dev tool, not part of the app. It lets you get a real Google
    ID token in your own browser, then calls your local API's
    <code>/api/v1/auth/social/google</code> endpoint with it.
  </p>

  <label for="clientId">Google OAuth Client ID (Web application type)</label>
  <input id="clientId" placeholder="123456789-abc.apps.googleusercontent.com" />

  <label for="apiBase">API base URL</label>
  <input id="apiBase" value="http://localhost:8000" />

  <label for="userType">user_type (only needed the first time this Google account signs up)</label>
  <select id="userType">
    <option value="CUSTOMER">CUSTOMER</option>
    <option value="BRAIDER">BRAIDER</option>
  </select>

  <button onclick="loadSignIn()">1. Load Google Sign-In button</button>
  <div id="signin-slot"></div>

  <h3>ID token (this is the "provider_token")</h3>
  <textarea id="tokenBox" readonly placeholder="Appears here after you sign in above"></textarea>

  <button onclick="callApi()">2. Call /api/v1/auth/social/google with this token</button>

  <h3>API response</h3>
  <pre id="result">(nothing yet)</pre>

  <script>
    function loadSignIn() {
      const clientId = document.getElementById("clientId").value.trim();
      if (!clientId) {
        alert("Paste your Google OAuth Client ID first.");
        return;
      }
      google.accounts.id.initialize({
        client_id: clientId,
        callback: handleCredentialResponse,
      });
      google.accounts.id.renderButton(
        document.getElementById("signin-slot"),
        { theme: "outline", size: "large" }
      );
    }

    function handleCredentialResponse(response) {
      document.getElementById("tokenBox").value = response.credential;
    }

    async function callApi() {
      const apiBase = document.getElementById("apiBase").value.trim();
      const token = document.getElementById("tokenBox").value.trim();
      const userType = document.getElementById("userType").value;
      const resultEl = document.getElementById("result");

      if (!token) {
        alert("Sign in with Google first to get a token.");
        return;
      }

      resultEl.textContent = "Calling API...";
      try {
        const resp = await fetch(`${apiBase}/api/v1/auth/social/google`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ provider_token: token, user_type: userType }),
        });
        const body = await resp.json();
        resultEl.textContent = `HTTP ${resp.status}\n\n` + JSON.stringify(body, null, 2);
      } catch (err) {
        resultEl.textContent = "Request failed: " + err;
      }
    }
  </script>
</body>
</html>
